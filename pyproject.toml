# Zero dependencies, so plain setuptools is enough. The version lives only in
# omhc/__init__.py (the release workflow checks the tag matches it).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omhc"
dynamic = ["version"]
description = "Carry context across Claude Code and Codex when you switch harnesses"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SungJun1217" }]
keywords = ["claude-code", "codex", "ai-agents", "handoff", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SungJun1217/oh-my-harness-cowork"
Issues = "https://github.com/SungJun1217/oh-my-harness-cowork/issues"

[project.scripts]
omhc = "omhc.cli:main"

[tool.setuptools.dynamic]
version = { attr = "omhc.__version__" }

[tool.setuptools.packages.find]
include = ["omhc*"]
