name: Bug report
description: omhc does something other than what you expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Don't paste raw session content (real conversations). For a security problem, use a
        [private report](https://github.com/SungJun1217/oh-my-harness-cowork/security/advisories/new) instead of an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected behavior vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Work in Claude Code, then quit
        2. Run codex in the same repo
        3. The handoff is empty
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`omhc status --json` output"
      render: json
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "omhc 0.1.0 (or a commit) · Claude Code 2.x · codex-cli 0.155.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Handoff direction
      options: [Claude Code → Codex, Codex → Claude Code, Not applicable]
