name: Wrong handoff content
description: Something other than a human turn ended up in GOAL/NEXT, or harness-internal text leaked into the handoff
labels: [bug, handoff]
body:
  - type: markdown
    attributes:
      value: |
        This is the most serious kind of omhc bug: an agent's proposal passing as a human
        instruction (`GOAL`/`NEXT`), or harness-internal text such as system-reminders or
        skill_listing riding along in the handoff (AGENTS.md invariants 3 and 4).

        **Don't paste raw session content**, and the full handoff isn't needed either. Just
        tell us which slot was filled with what kind of text.
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - Something the agent said ended up in GOAL or NEXT
        - A short approval ("go ahead") became NEXT
        - A subagent or sidechain turn was taken as a human turn
        - Harness-internal text (system-reminder, attachment, environment info, …) was included
        - Other
    validations:
      required: true
  - type: input
    id: slot
    attributes:
      label: Affected slot
      placeholder: "NEXT"
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What kind of text got in
      description: Describe it instead of pasting it, e.g. "the last sentence of the previous agent reply", "a block starting with <system-reminder>"
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Direction
      options:
        - Claude Code → Codex CLI
        - Codex CLI → Claude Code
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "omhc 0.1.14 · Claude Code 2.x · codex-cli 0.156.1"
    validations:
      required: true
