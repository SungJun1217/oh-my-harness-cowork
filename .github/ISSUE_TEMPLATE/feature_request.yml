name: Feature request
description: A new harness adapter, slot, command, …
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the pain
      description: Describe a situation you actually ran into during a day of work
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: New harness adapter (if it needs core changes, that's an adapter-contract defect)
        - label: Needs no LLM calls or external dependencies
