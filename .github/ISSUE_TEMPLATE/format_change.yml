name: 하네스 포맷 변경
description: Claude Code 나 Codex CLI 를 업데이트한 뒤 세션을 못 읽거나 이벤트가 비어 보일 때
labels: [bug, format-change]
body:
  - type: markdown
    attributes:
      value: |
        두 하네스의 세션 파일 포맷은 문서화되지 않았고 예고 없이 바뀝니다. omhc 는
        화이트리스트로만 파싱하므로, 포맷이 바뀌면 조용히 덜 읽습니다.

        **세션 원문은 붙이지 마십시오.** 키 이름과 레코드 종류, 개수만 알려 주시면 됩니다.
  - type: dropdown
    id: harness
    attributes:
      label: 하네스
      options:
        - Claude Code
        - Codex CLI
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 문제가 생긴 버전과 마지막으로 잘 되던 버전
      placeholder: "codex-cli 0.157.0 (0.156.1 까지는 정상)"
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 예를 들어 "DID 가 늘 비어 있다", "FAIL 이 안 잡힌다", "GOAL 이 없다"
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`omhc status --json` 출력"
      description: 어느 하네스가 감지되고 무엇이 아카이브됐는지 보려고 합니다
      render: json
    validations:
      required: true
  - type: textarea
    id: records
    attributes:
      label: 새로 보이는 레코드 모양 (선택)
      description: '값은 지우고 키 구조만 적어 주십시오. 예를 들어 `{"type": "...", "payload": {"kind": "...", ...}}`'
