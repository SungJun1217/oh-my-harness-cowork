name: Harness format change
description: After updating Claude Code or Codex CLI, sessions can't be read or events come out empty
labels: [bug, format-change]
body:
  - type: markdown
    attributes:
      value: |
        Neither harness documents its session file format, and both change it without notice.
        omhc parses by whitelist only, so a format change makes it silently read less.

        **Don't paste raw session content.** Key names, record types and counts are enough.
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Codex CLI
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Broken version and last working version
      placeholder: "codex-cli 0.157.0 (fine up to 0.156.1)"
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: e.g. "DID is always empty", "FAIL never shows up", "no GOAL"
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`omhc status --json` output"
      description: To see which harnesses are detected and what got archived
      render: json
    validations:
      required: true
  - type: textarea
    id: records
    attributes:
      label: Shape of the new records (optional)
      description: 'Strip the values and give only the key structure, e.g. `{"type": "...", "payload": {"kind": "...", ...}}`'
