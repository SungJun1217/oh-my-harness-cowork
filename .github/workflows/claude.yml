# Runs Claude Code only when someone mentions @claude in an issue or PR. No automatic review.
#
# The repo is public, so anyone can comment; it only runs when the mentioner is an
# OWNER/MEMBER/COLLABORATOR (so outsiders' mentions don't spend tokens).
#
# Auth is the CLAUDE_CODE_OAUTH_TOKEN secret (issued by `claude setup-token`). The
# repo's default GITHUB_TOKEN is read-only — comments, branches and PRs are written
# with the Claude GitHub App token obtained via id-token, so the permissions below
# are read + id-token only.
#
# issue_comment/issues events only run workflows from the default branch (main), so
# a change here takes effect once it is released to main, not while it sits on develop.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read   # lets it read CI results on PRs
      id-token: write # exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
