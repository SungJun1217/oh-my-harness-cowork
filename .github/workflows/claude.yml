# 이슈·PR 에서 @claude 로 멘션했을 때만 Claude Code 를 돌린다. 자동 리뷰는 없다.
#
# 공개 레포라 누구나 댓글을 달 수 있으므로, 멘션한 사람이 OWNER/MEMBER/
# COLLABORATOR 일 때만 돈다(외부인의 멘션으로 토큰을 쓰지 않게).
#
# 인증은 CLAUDE_CODE_OAUTH_TOKEN 시크릿(claude setup-token 으로 발급). 레포의
# 기본 GITHUB_TOKEN 은 읽기 전용이다 — 댓글·브랜치·PR 쓰기는 id-token 으로 받는
# Claude GitHub App 토큰이 한다. 그래서 아래 permissions 는 읽기 + id-token 뿐이다.
#
# issue_comment/issues 이벤트는 기본 브랜치(main)의 워크플로만 돈다. develop 에
# 있어서는 동작하지 않고, main 으로 릴리스된 뒤부터 동작한다.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read   # PR 에서 CI 결과를 읽게
      id-token: write # Claude GitHub App 토큰 교환
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
