# Pushing a v* tag builds the sdist/wheel and attaches them to a GitHub Release. Fails
# if the tag and omhc.__version__ differ.
#
# The notes are the chore(release) commit body. We push straight to develop/main
# without PRs, so --generate-notes only produces a one-line "Full Changelog"; the
# release commit body already is the change list. If no body is found, it falls
# back to the generated notes as before.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Finding the release commit and the previous tag needs full history and tags.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: tag matches __version__
        run: |
          v=$(python -c 'import omhc; print(omhc.__version__)')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - name: tests
        run: |
          python -m unittest discover -s tests -t . -q
          bash tests/smoke.sh
      - name: build
        run: |
          python -m pip install --quiet build
          python -m build
      - name: release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          # Escape the dots and anchor the end so 0.1.1 does not match 0.1.13.
          body=$(git log -1 --format=%b --grep="^chore(release): ${v//./\\.}\$" "$GITHUB_REF_NAME" | sed '/^Co-Authored-By:/d')
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            [ -n "$body" ] && printf '%s\n' "$body"
            [ -n "$prev" ] && printf '\n**Full Changelog**: %s/compare/%s...%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME"
            true
          } > notes.md
          cat notes.md
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '[^[:space:]]' notes.md; then
            gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
          fi
