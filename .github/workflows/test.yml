# Runs every version from the supported minimum (3.9) to the latest. Dev machines have
# different python3s, so one green local version can't guarantee "every 3.x from 3.9".
#
# Fixtures (real conversations) are never committed, so tests that need them skip here;
# they are covered by the local suite after running harvest.py on your own machine.
name: test

on:
  push:
  pull_request:

# Tests only check out the code — the GITHUB_TOKEN gets nothing beyond read
# (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Hardlinks, inodes and path slugs differ by OS; macOS runs only the two end versions.
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -t . -q
      - name: smoke
        run: bash tests/smoke.sh
