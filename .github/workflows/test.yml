# 지원 하한(3.9)부터 최신까지 전부 돌린다. 개발 머신마다 python3 가 달라서 로컬
# 한 버전의 그린으로는 "3.9 이상 모든 3.x" 를 보장하지 못한다.
#
# 픽스처(실제 대화)는 커밋되지 않으므로 그에 의존하는 테스트는 여기서 건너뛴다.
# 그 몫은 각자 머신에서 harvest.py 후 돌리는 로컬 스위트다.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # 하드링크·inode·경로 슬러그가 OS 에 따라 다르다. 양 끝 버전만 맥에서 본다.
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -t . -q
      - name: smoke
        run: bash tests/smoke.sh
