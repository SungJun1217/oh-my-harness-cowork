<text x="40.0" y="64.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#EDE3D9" text-anchor="start" font-weight="600">SessionStart hook trusted</text>
<text x="40.0" y="88.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#EDE3D9" text-anchor="start" font-weight="600">and running?</text>
<text x="40.0" y="110.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A3968C" text-anchor="start">gates everything below</text>
<text x="40.0" y="272.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#F0A45C" text-anchor="start" font-weight="600">Path A</text>
<text x="40.0" y="294.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#EDE3D9" text-anchor="start">adapter.install_handoff()</text>
<text x="40.0" y="470.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#EDE3D9" text-anchor="start" font-weight="600">Path B available? (Codex only)</text>
<text x="40.0" y="492.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A3968C" text-anchor="start">never when AGENTS.md is shared</text>
<text x="40.0" y="510.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A3968C" text-anchor="start">with Claude Code</text>
<text x="608.0" y="62.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#EDE3D9" text-anchor="start" font-weight="600">nothing delivered</text>
<text x="608.0" y="84.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A3968C" text-anchor="start">Path B / outbox never open --</text>
<text x="608.0" y="100.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A3968C" text-anchor="start">brief() itself does not run</text>
<text x="608.0" y="272.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#7FBFA4" text-anchor="start" font-weight="600">delivered</text>
<text x="608.0" y="294.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A3968C" text-anchor="start">handoff lands in the harness's</text>
<text x="608.0" y="310.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A3968C" text-anchor="start">own session-start context</text>
<text x="608.0" y="472.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#F0A45C" text-anchor="start" font-weight="600">Path B</text>
<text x="608.0" y="494.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#EDE3D9" text-anchor="start">AGENTS.md managed block</text>
<text x="608.0" y="514.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#A3968C" text-anchor="start">read by Codex on its next start</text>
<text x="608.0" y="672.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#EDE3D9" text-anchor="start">floor: &lt;repo&gt;/.omhc/outbox/</text>
<text x="608.0" y="694.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A3968C" text-anchor="start">not auto-read by either harness</text>
<text x="532.0" y="70.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#A3968C" text-anchor="middle">no</text>
<text x="60.0" y="183.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#A3968C" text-anchor="start">yes</text>
<text x="532.0" y="275.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#7FBFA4" text-anchor="middle">success</text>
<text x="60.0" y="383.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#A3968C" text-anchor="start">failure</text>
<text x="532.0" y="461.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#A3968C" text-anchor="middle">yes</text>
<text x="543.0" y="507.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#A3968C" text-anchor="start">no</text>
<text x="630.0" y="583.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#A3968C" text-anchor="start">failure</text>
<text x="520.0" y="760.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#A3968C" text-anchor="middle">the hook-not-trusted branch cuts off Path B and the outbox too --</text>
<text x="520.0" y="780.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#A3968C" text-anchor="middle">brief() has to run at all for either fallback to open</text>
</svg>