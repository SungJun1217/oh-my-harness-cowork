<text x="36.0" y="102.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#A3968C" text-anchor="start">session file on disk</text>
<text x="36.0" y="120.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#A3968C" text-anchor="start">(JSONL / rollout)</text>
<text x="36.0" y="170.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#A3968C" text-anchor="start">already on disk --</text>
<text x="36.0" y="188.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#A3968C" text-anchor="start">nothing is re-run</text>
<text x="816.0" y="74.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#EDE3D9" text-anchor="start" font-weight="600">Claude Code</text>
<text x="816.0" y="102.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#A3968C" text-anchor="start">new session</text>
<text x="816.0" y="152.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#EDE3D9" text-anchor="start">SessionStart hook</text>
<text x="816.0" y="170.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#EDE3D9" text-anchor="start">fires here</text>
<text x="816.0" y="218.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#A3968C" text-anchor="start">handoff shows up</text>
<text x="816.0" y="236.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#A3968C" text-anchor="start">in its context</text>
<text x="520.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#EDE3D9" text-anchor="middle" font-weight="600">omhc</text>
<text x="520.0" y="88.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#A3968C" text-anchor="middle">brief.compute()</text>
<text x="398.0" y="124.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#EDE3D9" text-anchor="start">due() -&gt; other harness's session</text>
<text x="398.0" y="151.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#EDE3D9" text-anchor="start">parse -&gt; whitelist -&gt; Event</text>
<text x="398.0" y="178.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#F0A45C" text-anchor="start">mint() &lt;= 900 B (assert)</text>
<text x="398.0" y="205.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#EDE3D9" text-anchor="start">gate() once per session</text>
<text x="398.0" y="232.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#EDE3D9" text-anchor="start">archive: os.link + TSV index</text>
<text x="398.0" y="259.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#EDE3D9" text-anchor="start">deliver() -&gt; stdout (delivered.tsv)</text>
<text x="287.0" y="105.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#A3968C" text-anchor="middle">read (parse)</text>
<text x="745.0" y="167.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#A3968C" text-anchor="middle">mark + brief</text>
<text x="745.0" y="217.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#7FBFA4" text-anchor="middle">inject: stdout</text>
<text x="200.0" y="430.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#EDE3D9" text-anchor="start" font-weight="600">archive (written after gate)</text>
<text x="200.0" y="458.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#EDE3D9" text-anchor="start">~/.omhc/&lt;repo-key&gt;/</text>
<text x="200.0" y="480.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#EDE3D9" text-anchor="start">os.link hardlinks the original session file</text>
<text x="200.0" y="502.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#EDE3D9" text-anchor="start">TSV offset index, ~115 B per event</text>
<text x="200.0" y="524.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#EDE3D9" text-anchor="start">omhc show E1 reads the original bytes back by offset</text>
<text x="520.0" y="590.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3968C" text-anchor="middle">the same path runs in reverse</text>
<text x="520.0" y="612.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3968C" text-anchor="middle">Codex→Claude and Claude→Codex both need the Codex SessionStart hook trusted: its mark is what records Codex sessions.</text>
</svg>