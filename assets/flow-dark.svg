<circle cx="377.0" cy="227.0" r="11.0" fill="#A3968C"/><text x="377.0" y="231.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#1B1917" text-anchor="middle" font-weight="bold">5</text>
